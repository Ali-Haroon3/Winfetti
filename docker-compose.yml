services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: winfetti
      POSTGRES_PASSWORD: winfetti
      POSTGRES_DB: winfetti
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U winfetti"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://winfetti:winfetti@db:5432/winfetti
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      TREMENDOUS_API_KEY: ${TREMENDOUS_API_KEY:-}
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
